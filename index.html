<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recorrido AR</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MINDAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* =========================
           ENCABEZADO
           ========================= */

        #encabezado {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 60px;

            background: rgba(0, 0, 0, 0.85);

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #encabezado button {
            padding: 8px 18px;
            font-size: 15px;
        }


        /* =========================
           PIE
           ========================= */

        #pie {
            position: fixed;
            bottom: 0;
            left: 0;

            width: 100%;
            height: 45px;

            background: rgba(0, 0, 0, 0.85);

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }


        /* =========================
           RESULTADO AR
           ========================= */

        #resultadoAR {
            position: fixed;

            right: 0;

            top: 60px;
            bottom: 45px;

            width: auto;
            height: auto;

            max-height: calc(100vh - 105px);

            object-fit: contain;

            z-index: 15;

            display: none;
        }


        /* CUADRADO */

        #resultadoAR.cuadrado {
            max-width: 40vw;
        }


        /* HORIZONTAL 16:9 */

        #resultadoAR.horizontal {
            max-width: 65vw;
        }


        /* VERTICAL 9:19 */

        #resultadoAR.vertical {
            max-width: 40vw;
        }


        /* =========================
           ESCENA AR
           ========================= */

        a-scene {
            position: fixed;

            top: 60px;
            left: 0;

            width: 100%;
            height: calc(100% - 105px);
        }

    </style>
</head>


<body>


    <!-- =========================
         ENCABEZADO
         ========================= -->

    <div id="encabezado">

        <button>BOTÓN 1</button>

        <button>BOTÓN 2</button>

    </div>


    <!-- =========================
         RESULTADO QUE CAMBIA
         ========================= -->

    <img
        id="resultadoAR"
        src=""
        alt="Resultado AR"
    >


    <!-- =========================
         ESCENA MINDAR
         ========================= -->

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- TARGET 01 -->
        <a-entity
            mindar-image-target="targetIndex: 0"
            data-resultado="./r01.jpg"
            data-formato="cuadrado">
        </a-entity>


        <!-- TARGET 02 -->
        <a-entity
            mindar-image-target="targetIndex: 1"
            data-resultado="./r02.jpg"
            data-formato="cuadrado">
        </a-entity>


        <!-- TARGET 03 -->
        <a-entity
            mindar-image-target="targetIndex: 2"
            data-resultado="./r03.jpg"
            data-formato="cuadrado">
        </a-entity>


        <!-- TARGET 04 -->
        <a-entity
            mindar-image-target="targetIndex: 3"
            data-resultado="./r04.jpg"
            data-formato="vertical">
        </a-entity>


        <!-- TARGET 05 -->
        <a-entity
            mindar-image-target="targetIndex: 4"
            data-resultado="./r05.jpg"
            data-formato="cuadrado">
        </a-entity>


        <!-- TARGET 06 -->
        <a-entity
            mindar-image-target="targetIndex: 5"
            data-resultado="./r06.jpg"
            data-formato="vertical">
        </a-entity>


        <!-- TARGET 07 -->
        <a-entity
            mindar-image-target="targetIndex: 6"
            data-resultado="./r07.jpg"
            data-formato="horizontal">
        </a-entity>


        <!-- TARGET 08 -->
        <a-entity
            mindar-image-target="targetIndex: 7"
            data-resultado="./r08.jpg"
            data-formato="horizontal">
        </a-entity>


    </a-scene>


    <!-- =========================
         PIE
         ========================= -->

    <div id="pie">
        PIE DE PÁGINA
    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const resultado = document.getElementById("resultadoAR");

        let ocultarTimer = null;


        /*
        ==========================================
        FUNCIÓN PARA MOSTRAR UN RESULTADO
        ==========================================
        */

        function mostrarResultado(target) {

            clearTimeout(ocultarTimer);

            const archivo = target.getAttribute("data-resultado");
            const formato = target.getAttribute("data-formato");

            resultado.src = archivo;

            resultado.className = formato;

            resultado.style.display = "block";
        }


        /*
        ==========================================
        FUNCIÓN PARA OCULTAR DESPUÉS DE 2 SEGUNDOS
        ==========================================
        */

        function ocultarResultado() {

            clearTimeout(ocultarTimer);

            ocultarTimer = setTimeout(() => {

                resultado.style.display = "none";

            }, 2000);
        }


        /*
        ==========================================
        CONECTAR LOS 8 TARGETS
        ==========================================
        */

        const targets = document.querySelectorAll(
            "[mindar-image-target]"
        );


        targets.forEach((target) => {


            /*
            TARGET ENCONTRADO
            */

            target.addEventListener("targetFound", () => {

                mostrarResultado(target);

            });


            /*
            TARGET PERDIDO
            */

            target.addEventListener("targetLost", () => {

                ocultarResultado();

            });

        });

    </script>


</body>

</html>
