<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Prueba MindAR</title>

    <!-- A-Frame 1.3.0 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- MindAR 1.2.5 -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 10;"
        embedded
        loading-screen="enabled: false"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- IMAGEN RESULTADO -->
        <a-assets>
            <img
                id="resultado"
                src="./r01_esqueleto.png"
                crossorigin="anonymous">
        </a-assets>

        <!-- CÁMARA -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- TARGET 0 -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- RESULTADO QUE APARECE AL RECONOCER EL TARGET -->
            <a-image
                src="#resultado"
                position="0 0 0"
                width="1"
                height="1">
            </a-image>

        </a-entity>

    </a-scene>

</body>
</html>
